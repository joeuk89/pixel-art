// Room box: back wall square-on, everything else toward one vanishing point; f is the camera distance in back-wall pixels.

function renderShell(v) {

// "Drawn in perspective": the local engine draws seams, grooves and coffers as one-pixel lines at their projected

const drops = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 2 + Math.random() * 2, c: 5 + (Math.random() * 3 | 0) }));

const VARIANTS = [

const params = new URLSearchParams(location.search);

document.getElementById("src").onclick = () => cycle("src", SOURCES);
document.getElementById("feat").onclick = () => cycle("feat", FEATS);
document.getElementById("atmos").onclick = () => { state.atmos = !state.atmos; render(); };
document.getElementById("depth").onclick = () => depth(G.f >= 400 ? -340 : 40);
document.getElementById("notesBtn").onclick = () => { state.notes = !state.notes; render(); };
addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
  else if (e.key === "s") cycle("src", SOURCES); else if (e.key === "f") cycle("feat", FEATS);
  else if (e.key === "a") { state.atmos = !state.atmos; render(); } else if (e.key === "n") { state.notes = !state.notes; render(); }
  else if (e.key === "-") depth(-40); else if (e.key === "=") depth(40);
});
addEventListener("resize", layout);

Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise((ok) => { const i = new Image(); i.onload = () => { img[k] = i; ok(); }; i.src = src; })))
  .then(() => {
    LOCALSET = Object.fromEntries(Object.entries(LOCAL).map(([k, fn]) => [k, fn()]));
    const g = (n, trim) => (img["gen:" + n] ? fromImg(img["gen:" + n], trim) : null);
    HAVE_GEN = !!img["gen:tex-floor"];
    PIXELLAB = {
      floor: g("tex-floor") ?? LOCALSET.floor, wall: g("tex-wall") ?? LOCALSET.wall, ceiling: g("tex-ceiling") ?? LOCALSET.ceiling,
      painting: g("painting-flat", true) ?? LOCALSET.painting, sconce: g("sconce", true) ?? LOCALSET.sconce, rug: g("rug-flat", true) ?? LOCALSET.rug,
      angled: { painting: g("painting-angled", true), rug: g("rug-angled", true) },
    };
    if (img["gen:sconce"]) PIXELLAB.sconce = resize(PIXELLAB.sconce, (PIXELLAB.sconce.w * 12) / PIXELLAB.sconce.h, 12);
    state.vi = Math.max(0, VARIANTS.findIndex((v) => v.key === (params.get("variant") ?? "project-back")));
    layout(); render();
    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
