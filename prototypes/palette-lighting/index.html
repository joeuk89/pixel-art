<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE: palette lighting</title>
<style>
  html, body { margin: 0; height: 100%; background: #120e1a; color: #d6d0cc; font: 13px/1.4 ui-monospace, monospace; }
  body { display: grid; grid-template-columns: 1fr 340px; }
  body.bare { grid-template-columns: 1fr; }
  body.bare #panel { display: none; }
  #stage { display: grid; place-items: center; overflow: hidden; }
  canvas { image-rendering: pixelated; display: block; }
  #panel { overflow-y: auto; padding: 12px 14px 80px; background: #1a1424; border-left: 1px solid #3b2f52; }
  #panel h2 { font-size: 13px; margin: 16px 0 6px; color: #f7d35c; }
  label { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  label input[type=range] { flex: 1; }
  pre { white-space: pre-wrap; margin: 0; font-size: 12px; }
  button { font: inherit; background: #3b2f52; color: #f6e8cc; border: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  .ramps { border-collapse: collapse; }
  .ramps td { width: 14px; height: 14px; padding: 0; }
  .ramps td.base { outline: 2px solid #f6e8cc; outline-offset: -2px; }
  .ramps th { font-weight: normal; font-size: 10px; padding: 0 4px; text-align: right; }
  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: #fff; color: #111; padding: 6px 10px; border-radius: 999px; box-shadow: 0 4px 16px #0008; font-weight: bold; z-index: 9; }
  #switcher button { background: #111; color: #fff; border-radius: 999px; }
</style>
<div id="stage"><canvas id="scene" width="192" height="120"></canvas></div>
<div id="panel"></div>
<div id="switcher"><button id="prev">&larr;</button><span id="label"></span><button id="next">&rarr;</button></div>
<script type="module" src="out/app.js"></script>
