<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene engine prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0810; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #ddd; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #0a0810; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: rgba(20,16,30,.92); border-top: 1px solid #333; }
  #bar label { white-space: nowrap; cursor: pointer; }
  #bar select, #bar button { font: inherit; background: #2a2340; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 2px 6px; }
  #stats { position: fixed; top: 8px; left: 8px; background: rgba(0,0,0,.7); padding: 6px 8px; white-space: pre; font: 11px/1.4 ui-monospace, monospace; border-radius: 3px; pointer-events: none; }
  #log { position: fixed; top: 8px; right: 8px; width: 360px; height: 160px; background: rgba(0,0,0,.7); color: #bbb; border: 1px solid #333; font: 10px/1.3 ui-monospace, monospace; display: none; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #reduced { display: inline; } }
  #reduced { display: none; color: #f7d35c; }
</style>
<div id="stage"><canvas id="c" width="192" height="120"></canvas></div>
<div id="stats"></div>
<textarea id="log" readonly></textarea>
<div id="bar">
  <label><input type="checkbox" data-k="rain" checked> rain</label>
  <label><input type="checkbox" data-k="glow" checked> lamp glow</label>
  <label><input type="checkbox" data-k="steam" checked> steam</label>
  <label><input type="checkbox" data-k="twinkle" checked> window twinkle</label>
  <label><input type="checkbox" data-k="drift" checked> parallax drift</label>
  <label><input type="checkbox" data-k="pointer"> pointer parallax</label>
  <label><input type="checkbox" data-k="keyed" checked> see-through glass</label>
  <label>weather fps <select data-k="wfps"><option>12</option><option selected>24</option><option>30</option><option value="0">uncapped</option></select></label>
  <label>props fps <select data-k="pfps"><option>6</option><option selected>10</option><option>12</option></select></label>
  <label>loop <select data-k="loop"><option value="raf" selected>rAF 60Hz</option><option value="timer">timer + rAF</option></select></label>
  <label>scale <select data-k="scale"><option value="int" selected>integer</option><option value="fit">fit (non-integer)</option></select></label>
  <label><input type="checkbox" data-k="stats" checked> stats</label>
  <label><input type="checkbox" data-k="log"> soak log</label>
  <button id="fs">fullscreen (click also = unmute)</button>
  <span>H hides this bar</span>
  <span id="reduced">prefers-reduced-motion: on, weather frozen</span>
</div>

function writeHash() { const p = new URLSearchParams(); for (const k in S) p.set(k, typeof S[k] === 'boolean' ? (S[k] ? 1 : 0) : S[k]); history.replaceState(null, '', '#' + p); }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const off = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = src; });

// Deterministic PRNG so the Scene replays identically.
let seed = 1337; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

let layers = {}, rects = {}, twinklePx = [], skyColour = PAL.sky1;
const rain = [], steam = [];
let glowA = 1, glowTarget = 1, twinkleOverlay, driftT = 0, pointerX = 0, pointerY = 0;

async function build() {
  const img = {}; for (const k in ASSETS) img[k] = await loadImg(ASSETS[k]);
  const win = { x: Math.round(W / 2 - img.window.width / 2), y: 6, w: img.window.width, h: img.window.height };
  rects.hole = { x: win.x + 6, y: win.y + 6, w: win.w - 12, h: win.h - 12 }; // pane area, tuned by eye
  rects.lamp = { x: 8, y: DESK_Y + 6 - img.lamp.height, w: img.lamp.width, h: img.lamp.height };
  rects.cat = { x: Math.round(W / 2 - img.cat.width / 2 + 10), y: DESK_Y + 10 - img.cat.height, w: img.cat.width, h: img.cat.height };
  rects.mug = { x: W - img.mug.width - 10, y: DESK_Y + 8 - img.mug.height, w: img.mug.width, h: img.mug.height };
  rects.win = win;

  // Sky: band above the skyline with stars and a moon; wider than W so it can drift.
  const skyW = W + 40, skyH = DESK_Y;
  { const [c, x] = off(skyW, skyH); layers.sky = c;
    x.fillStyle = PAL.sky0; x.fillRect(0, 0, skyW, skyH);
    x.fillStyle = PAL.sky1; x.fillRect(0, 12, skyW, skyH);
    for (let i = 0; i < 70; i++) { x.fillStyle = rnd() < .3 ? PAL.steam : PAL.haze; x.fillRect(Math.floor(rnd() * skyW), Math.floor(rnd() * 40), 1, 1); }

    x.fillStyle = PAL.sky1; x.fillRect(0, 0, W + 8, H);
    x.fillStyle = PAL.woodD; x.fillRect(0, DESK_Y, W + 8, H - DESK_Y); x.fillStyle = PAL.wood; x.fillRect(0, DESK_Y, W + 8, 2);
    x.clearRect(rects.hole.x + 4, rects.hole.y, rects.hole.w, rects.hole.h);
    if (keyed) { const [wc, wx] = off(win.w, win.h); wx.drawImage(img.window, 0, 0); const id = wx.getImageData(0, 0, win.w, win.h); const d = id.data;
      const glass = [[0x1c, 0x2d, 0x4a], [0x2f, 0x55, 0x78]];
      for (let i = 0; i < d.length; i += 4) { const px = (i / 4) % win.w, py = Math.floor(i / 4 / win.w); if (px < 6 || py < 6 || px >= win.w - 6 || py >= win.h - 6) continue; if (glass.some(g => g[0] === d[i] && g[1] === d[i + 1] && g[2] === d[i + 2])) d[i + 3] = 0; }
      wx.putImageData(id, 0, 0); x.drawImage(wc, win.x + 4, win.y); } else x.drawImage(img.window, win.x + 4, win.y);

  // Lamp glow sprite: a radial falloff quantised to four alpha steps so it keeps a pixel feel.
  { const [c, x] = off(56, 56); layers.glow = c; const steps = [[24, .05], [17, .07], [11, .10], [6, .14]];

  for (let i = 0; i < 34; i++) rain.push(spawnDrop(true));

}
function spawnDrop(anywhere) { const h = rects.hole; return { x: h.x + rnd() * (h.w + 8) - 4, y: anywhere ? h.y + rnd() * h.h : h.y - 3, len: 1 + Math.floor(rnd() * 2), v: 1.6 + rnd() * 1.2, hi: rnd() < .3 }; }

// ---- Ticks: each primitive updates at its own rate; a tick marks the frame dirty. ----
function tickWeather() {

}

  ctx.drawImage(layers.sky, Math.round(-20 + px * .15), Math.round(py * .1));
  const sk = rects.skyline; ctx.drawImage(layers.skyline, Math.round(-128 + px * .4), Math.round(sk.y + py * .3)); if (S.twinkle) ctx.drawImage(twinkleOverlay, Math.round(-128 + px * .4), Math.round(sk.y + py * .3));

  ctx.drawImage(S.keyed ? layers.nearKeyed : layers.near, Math.round(-4 + px), Math.round(py));
  if (S.steam) for (const p of steam) { if (p.life <= 0) continue; const a = p.life < 5 ? .4 : p.life < 15 ? .7 : .3; ctx.globalAlpha = a; ctx.fillStyle = p.life < 10 ? PAL.cream : PAL.steam; const s = p.life > 12 ? 2 : 1; ctx.fillRect(Math.round(p.x + px), Math.round(p.y + py), s, s); } ctx.globalAlpha = 1;

}

// ---- Loop: one rAF, accumulators per rate, draw only when something ticked. ----
let raf = 0, last = 0, accW = 0, accP = 0, accT = 0;
const M = { frames: 0, drawMs: 0, maxMs: 0, hiddenFrames: 0, secFrames: 0, secMs: 0, start: performance.now(), lastSec: performance.now(), lastMin: performance.now(), minFrames: 0, minMs: 0 };

</script>
